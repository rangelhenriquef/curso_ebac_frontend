<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>
        .container,
        .form-label,
        .btn {
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col">
                <h2>Formulário de Cadastro</h2>
                <form>
                    <label class="form-label" for="nome">Seu nome</label>
                    <input class="form-control" id="nome" type="text">

                    <label class="form-label" for="email">Seu e-mail</label>
                    <input class="form-control" id="email" type="email">

                    <label class="form-label" for="telefone">Seu telefone</label>
                    <input class="form-control" id="telefone" type="tel">

                    <button class="btn btn-outline-success">Enviar</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
